<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wander Lust</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-md bg-body-light border-bottom sticky-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="/"
          ><i class="fa-regular fa-compass"></i
        ></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav">
            <a class="nav-link" id="homeLink" aria-current="page" href="#"
              >Home</a
            >
            <a class="nav-link" id="allListingsLink" href="#">All Listings</a>
            <a class="nav-link" id="addListingLink" href="#">Add new Listing</a>
          </div>
          <!-- User Profile Icon on the Right -->
          <div class="navbar-nav ms-auto">
            <a class="nav-link" href="#" id="userIcon"
              ><i class="fa-regular fa-user"></i
            ></a>
          </div>
        </div>
      </div>
    </nav>

    <div class="container mt-3">
      <!-- View 1: All Listings (Homepage) -->
      <div id="listingsView">
        <h3 class="mb-3">All Listings</h3>

        <div
          class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
          id="listingsContainer"
        ></div>

        <!-- Pagination controls are generated by app.js -->
        <nav class="mt-4 mb-5" aria-label="Listings pages">
          <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
      </div>

      <!-- View 2: Add New Listing Form (Hidden by default) -->
      <div id="newListingView" class="d-none">
        <h3 class="mb-4">Create a New Listing</h3>
        <form id="newListingForm" class="col-md-8 offset-md-2">
          <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input
              type="text"
              class="form-control"
              id="title"
              placeholder="e.g. Cozy Beach Villa"
              required
            />
          </div>
          <div class="mb-3">
            <label for="image" class="form-label">Image URL</label>
            <input
              type="url"
              class="form-control"
              id="image"
              placeholder="https://..."
              required
            />
          </div>
          <div class="mb-3">
            <label for="price" class="form-label">Price (per night)</label>
            <input
              type="number"
              class="form-control"
              id="price"
              placeholder="1200"
              required
            />
          </div>
          <button
            type="submit"
            class="btn listing-action-btn text-white w-100"
          >
            Add Listing
          </button>
        </form>
      </div>
    </div>

    <!-- Sign-In Modal Box -->
    <div id="signInModal" class="sign-in-modal">
      <div class="sign-in-modal-content">
        <button id="closeModal" class="close-modal-btn" type="button">
          &times;
        </button>
        <h3 class="mb-3">Sign In</h3>
        <form>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input
              type="email"
              class="form-control"
              placeholder="Enter email"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              placeholder="Password"
              required
            />
          </div>
          <button
            type="submit"
            class="btn listing-action-btn w-100 text-white"
          >
            Login
          </button>
        </form>
      </div>
    </div>

    <footer>
      <div class="f-info">
        <div class="f-info-social">
          <i class="fa-brands fa-square-facebook"></i>
          <i class="fa-brands fa-instagram"></i>
          <i class="fa-brands fa-linkedin"></i>
        </div>
        <div class="f-info-brand">&copy; Wanderlust Private Limited</div>
        <div class="my-name">Made by Usman.J</div>
        <div class="f-info-links">
          <a>Privacy &nbsp;&nbsp;</a>
          <a>Terms</a>
        </div>
      </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
